<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post</title>
</head>
<body>

  <h2>Create a New Post</h2>

  <!-- enctype="multipart/form-data" image upload ke liye zaroori hai -->
  <form action="/createpost" method="POST" enctype="multipart/form-data">
    
    <!-- Image Input -->
    <div>
      <label for="imageUpload">Upload Image:</label>
      <input type="file" id="imageUpload" name="image" accept="image/png, image/jpeg" required>
    </div>

    <br>

    <!-- Caption Input -->
    <div>
      <label for="captionInput">Add Caption:</label>
      <input type="text" id="captionInput" name="caption" placeholder="Enter post caption" required>
    </div>

    <br>

    <!-- Submit Button -->
    <button type="submit">Submit Post</button>

  </form>

</body>
</html>
